<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://unpkg.com/tailwindcss@^1.0/dist/tailwind.min.css" rel="stylesheet">
  <title>Scholarship</title>
  <style>
    select { cursor: pointer; }
  </style>
</head>

<body class="bg-gray-50">

<header class="text-gray-600 body-font bg-white shadow-sm sticky top-0 z-50">
  <div class="container mx-auto flex p-5 items-center justify-between">
    <h1 class="text-xl font-bold">Find Scholarship By Caste</h1>

    <!-- Top Right Links -->
    <div class="space-x-4">
      <a href="privacy_policy.html" class="text-indigo-700 font-medium hover:underline">
        Privacy Policy
      </a>
      <a href="about_page.html" class="text-indigo-700 font-medium hover:underline">
        About
      </a>
      <a href="contact.html" class="text-indigo-700 font-medium hover:underline">
        Contact
      </a>
    </div>
  </div>
</header>
<section class="text-gray-600 body-font">
  <div class="container mx-auto flex px-5 py-12 md:flex-row flex-col items-center">
    
    <!-- Left Side -->
    <div class="lg:flex-grow md:w-1/2 lg:pr-24 md:pr-16 
      flex flex-col md:items-start md:text-left mb-16 md:mb-0 
      items-center text-center">

      <h1 class="title-font sm:text-4xl text-3xl mb-4 font-bold text-gray-900">
        Service to the People
      </h1>

      <p class="mb-6 leading-relaxed text-lg">
        Select your category to check eligible government scholarships.
      </p>

      <!-- Category Dropdown -->
      <div class="mb-4">
        <label class="block text-gray-700 font-medium mb-2">
          Select Your Category
        </label>

        <select id="casteSelect" onchange="filterSchemes()" 
          class="bg-gray-100 border border-gray-300 rounded px-4 py-2 w-80 focus:outline-none">
          <option value="">-- Select Category --</option>
          <option value="SC">SC (अनुसूचित जाति)</option>
          <option value="ST">ST (अनुसूचित जनजाति)</option>
          <option value="OBC">OBC (अन्य पिछड़ा वर्ग)</option>
          <option value="Combined">SC/ST/OBC Combined</option>
        </select>
      </div>

      <!-- Scholarship List -->
      <select id="yojnaSelect"
        class="bg-gray-100 border border-gray-300 rounded px-4 py-2 w-96 focus:outline-none h-10">
        <option disabled selected>Eligible Scholarship List</option>
      </select>

    </div>

    <!-- Right Side Image -->
    <div class="lg:max-w-lg lg:w-full md:w-1/2 w-5/6">
      <img class="object-cover object-center rounded-lg shadow-xl" 
        alt="government service" 
        src="https://plus.unsplash.com/premium_photo-1674591172888-1184c4170a47?w=800&auto=format&fit=crop&q=60">
    </div>

  </div>
</section>

<script>

const scholarships = [

  // SC
  { name: "Pre-Matric Scholarship (SC)", caste: "SC", link: "Pre-matric_scholarship.html" },
  { name: "Post-Matric Scholarship (SC)", caste: "SC", link: "post_matrics.html" },
  { name: "Top Class Education Scholarship (SC)", caste: "SC", link: "top_education.html" },
  { name: "State-Specific SC Scholarships", caste: "SC", link: "State_specific.html" },

  // ST
  { name: "Pre-Matric Scholarship (ST)", caste: "ST", link: "Pre-matric_scholarship.html" },
  { name: "Post-Matric Scholarship (ST)", caste: "ST", link: "post_matrics.html" },
  { name: "Gagan Bharari Shiksha Yojana", caste: "ST", link: "gagan_bharari.html" },
  { name: "Merit Based Scholarship Scheme", caste: "ST", link: "merit_based.html" },
  { name: "Home Nursing Scholarship", caste: "ST", link: "home_nursing.html" },
  { name: "ITI/Skill Scholarship", caste: "ST", link: "skill.html" },

  // OBC
  { name: "Pre-Matric Scholarship (OBC)", caste: "OBC", link: "Pre-matric_scholarship.html" },
  { name: "Post-Matric Scholarship (OBC)", caste: "OBC", link: "post_matrics.html" },
  { name: "State OBC Merit Scholarship", caste: "OBC", link: "state_OBC_merit.html" },

  // Combined
  { name: "Annual Aid up to ₹48,000", caste: "Combined", link: "annual_aid_up.html" },
  { name: "Merit/Performance Based Scholarships", caste: "Combined", link: "merit_performanced_based.html" }

];

function filterSchemes() {

  const caste = document.getElementById("casteSelect").value;
  const select = document.getElementById("yojnaSelect");

  select.innerHTML = "";

  if (!caste) {
    select.innerHTML = '<option disabled selected>Eligible Scholarship List</option>';
    return;
  }

  const filtered = scholarships.filter(s => s.caste === caste);

  select.innerHTML = '<option disabled selected>Select Scholarship</option>';

  filtered.forEach(item => {
    const opt = document.createElement("option");
    opt.textContent = "🎓 " + item.name;
    opt.value = item.link;
    select.appendChild(opt);
  });
}

// Redirect when selected
document.getElementById("yojnaSelect").addEventListener("change", function() {
  if (this.value) {
    window.location.href = this.value;
  }
});

</script>

</body>
</html>
